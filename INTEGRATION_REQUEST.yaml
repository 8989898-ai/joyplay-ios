# 将 <请填写> 替换为目标工程的真实信息，再交给 AI 执行接入。
project_path: <请填写.xcodeproj或xcworkspace>
project_kind: <project或workspace>
scheme: <请填写>
app_target: <请填写>
ui_framework: UIKit
minimum_ios: '15.6'

modes:
  full:
    enabled: true
    host_controller: <请填写>
    close_behavior: pop
  half:
    enabled: true
    host_controller: <请填写直播间控制器>
    close_behavior: remove_game_view
  large_half:
    enabled: true
    host_controller: <请填写语聊房控制器>
    close_behavior: remove_game_view

game_url:
  game_url_source: <请填写后端完整游戏URL字段或代码表达式>
  invalid_url_behavior: <请填写不打开游戏、提示或重试方式>
  requires_https: true
  backend_must_omit_safe_top: true
  backend_must_omit_padding_bottom: true
  client_appends_safe_top_for_full_screen: true
  client_appends_padding_bottom_for_full_screen: true

layout:
  width_height_ratio_source: <请填写后端字段或代码表达式，语义为宽除以高>
  invalid_ratio_behavior: <请填写不打开游戏、提示或重试方式>

recharge:
  ui_owner: host
  recharge_handler: <请填写充值页面或处理方法>
  notify_game_after_success: true

validation:
  configuration: Debug
  destination: generic/platform=iOS Simulator
